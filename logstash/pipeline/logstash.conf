input {
  file {
    path => "/app/logs/*.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/mlops-sincedb"
    codec => "plain"
    type => "mlops_logs"
  }
}

filter {
  if [type] == "mlops_logs" {
    grok {
      match => { "message" => "^%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{DATA:logger} %{GREEDYDATA:log_message}$" }
      tag_on_failure => ["_mlops_grok_failure"]
    }

    date {
      match => [ "timestamp", "yyyy-MM-dd HH:mm:ss" ]
      target => "@timestamp"
    }

    if [log_message] =~ /^event=/ {
      kv {
        source => "log_message"
        field_split => " "
        value_split => "="
        target => "event_data"
      }
    }

    mutate {
      add_field => {
        "service" => "mlflow_app"
        "environment" => "development"
      }
    }

    mutate {
      remove_field => [ "timestamp" ]
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "mlops-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}