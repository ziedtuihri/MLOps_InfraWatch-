input {
  # Filebeat input for general logs
  beats {
    port => 5044
    type => "beats"
  }
  
  # Direct file input for MLflow logs
  file {
    path => "/app/logs/mlflow.log"
    start_position => "beginning"
    type => "mlflow_logs"
    codec => "plain"
  }

  # Structured events from the API and malware notebooks
  file {
    path => [
      "/app/logs/mlops.log",
      "/app/logs/malwer_detecter.log",
      "/app/logs/cluster_monitoring.log",
      "/app/host-logs/hex_malware_detection.log",
      "/app/host-logs/malware_detection_notebook.log",
      "/app/host-logs/malwer_detecter.log",
      "/app/host-logs/cluster_monitoring.log"
    ]
    start_position => "beginning"
    type => "mlops_logs"
    codec => "plain"
  }
  
  # Heartbeat for monitoring
  heartbeat {
    interval => 30
    type => "heartbeat"
  }
}

filter {
  if [type] == "mlops_logs" {
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:log_timestamp} %{LOGLEVEL:log_level} %{DATA:logger_name} %{GREEDYDATA:log_message}"
      }
    }

    if [log_message] =~ /^event=/ {
      kv {
        source => "log_message"
        target => "event_data"
        field_split => " "
        value_split => "="
      }

      mutate {
        add_field => {
          "event_category" => "%{[event_data][event]}"
        }
        convert => {
          "[event_data][metric_accuracy]" => "float"
          "[event_data][metric_precision]" => "float"
          "[event_data][metric_recall]" => "float"
          "[event_data][metric_f1]" => "float"
          "[event_data][accuracy]" => "float"
          "[event_data][test_rows]" => "integer"
          "[event_data][dataset_rows]" => "integer"
          "[event_data][dataset_columns]" => "integer"
          "[event_data][feature_count]" => "integer"
          "[event_data][train_rows]" => "integer"
          "[event_data][true_negative]" => "integer"
          "[event_data][false_positive]" => "integer"
          "[event_data][false_negative]" => "integer"
          "[event_data][true_positive]" => "integer"
          "[event_data][sample_id]" => "integer"
          "[event_data][feature_usage_counter]" => "float"
          "[event_data][feature_fs_excl_counter]" => "float"
          "[event_data][feature_task_size]" => "float"
          "[event_data][feature_end_data]" => "float"
          "[event_data][feature_policy]" => "float"
          "[event_data][feature_nivcsw]" => "float"
          "[event_data][feature_importance]" => "float"
          "[event_data][importance_rank]" => "integer"
        }
      }

      date {
        match => [ "log_timestamp", "yyyy-MM-dd HH:mm:ss", "ISO8601" ]
        target => "@timestamp"
      }
    }
  }

  # Handle MLflow specific logs
  if [type] == "mlflow_logs" {
    # Parse the message field to extract MLFLOW_EVENT logs
    if [message] =~ /MLFLOW_EVENT:/ {
      grok {
        match => { "message" => "MLFLOW_EVENT: %{GREEDYDATA:event_json}" }
      }
      
      # Parse the JSON event data
      json {
        source => "event_json"
        target => "mlflow_event"
      }
      
      # Add pipeline metadata
      mutate {
        add_field => {
          "pipeline" => "mlflow"
          "log_level" => "INFO"
          "logger_name" => "mlflow_app"
        }
      }
      
      # Extract specific event types for easier filtering
      if [mlflow_event][event_type] {
        mutate {
          add_field => { "event_category" => "%{[mlflow_event][event_type]}" }
        }
      }
      
      # Add timestamp from the event if available
      if [mlflow_event][timestamp] {
        date {
          match => [ "mlflow_event.timestamp", "ISO8601" ]
          target => "@timestamp"
        }
      }
    }
    
    # For regular log messages (non-MLFLOW_EVENT)
    else {
      grok {
        match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{DATA:name} %{GREEDYDATA:log_message}" }
      }
      
      mutate {
        add_field => {
          "pipeline" => "mlflow"
          "event_category" => "general_log"
        }
      }
    }
  }
  
  # Handle beats input (general logs)
  if [type] == "beats" {
    mutate {
      add_field => { "pipeline" => "general" }
    }
    
    # Parse JSON logs if they exist
    if [message] =~ /^\{.*\}$/ {
      json {
        source => "message"
        target => "parsed_log"
      }
    }
  }
  
  # Handle heartbeat
  if [type] == "heartbeat" {
    mutate {
      add_field => {
        "pipeline" => "monitoring"
        "event_category" => "heartbeat"
      }
    }
  }
  
  # Common processing for all log types
  mutate {
    add_field => {
      "environment" => "mlops"
      "service" => "mlflow_pipeline"
    }
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "logs-%{+YYYY.MM.dd}"
    user => "elastic"
    password => "changeme"
    template_name => "logs"
    template => {
      "index_patterns" => ["logs-*"]
      "settings" => {
        "number_of_shards" => 1
        "number_of_replicas" => 0
      }
      "mappings" => {
        "properties" => {
          "@timestamp" => { "type" => "date" }
          "pipeline" => { "type" => "keyword" }
          "event_category" => { "type" => "keyword" }
          "log_level" => { "type" => "keyword" }
          "service" => { "type" => "keyword" }
          "environment" => { "type" => "keyword" }
          "mlflow_event" => { "type" => "object" }
          "event_data" => {
            "properties" => {
              "event" => { "type" => "keyword" }
              "model" => { "type" => "keyword" }
              "dataset" => { "type" => "keyword" }
              "target" => { "type" => "keyword" }
              "positive_class" => { "type" => "keyword" }
              "feature_columns" => { "type" => "keyword" }
              "feature_count" => { "type" => "integer" }
              "train_rows" => { "type" => "integer" }
              "metric_accuracy" => { "type" => "float" }
              "metric_precision" => { "type" => "float" }
              "metric_recall" => { "type" => "float" }
              "metric_f1" => { "type" => "float" }
              "accuracy" => { "type" => "float" }
              "test_rows" => { "type" => "integer" }
              "dataset_rows" => { "type" => "integer" }
              "dataset_columns" => { "type" => "integer" }
              "sample_id" => { "type" => "integer" }
              "true_negative" => { "type" => "integer" }
              "false_positive" => { "type" => "integer" }
              "false_negative" => { "type" => "integer" }
              "true_positive" => { "type" => "integer" }
              "prediction" => { "type" => "keyword" }
              "file_name" => { "type" => "keyword" }
              "details" => { "type" => "keyword" }
              "feature_usage_counter" => { "type" => "float" }
              "feature_fs_excl_counter" => { "type" => "float" }
              "feature_task_size" => { "type" => "float" }
              "feature_end_data" => { "type" => "float" }
              "feature_policy" => { "type" => "float" }
              "feature_nivcsw" => { "type" => "float" }
              "feature_column" => { "type" => "keyword" }
              "feature_importance" => { "type" => "float" }
              "importance_rank" => { "type" => "integer" }
            }
          }
        }
      }
    }
  }
  
  # Debug output to console
  stdout {
    codec => rubydebug
  }
} 