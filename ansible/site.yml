---
- name: Automate project Makefile workflows
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    project_dir: "{{ playbook_dir }}/.."

  tasks:
    - name: Install project dependencies
      ansible.builtin.command: make install
      args:
        chdir: "{{ project_dir }}"
      tags: [setup]

    - name: Start the Docker Compose stack
      ansible.builtin.command: make up
      args:
        chdir: "{{ project_dir }}"
      tags: [stack, training]

    - name: Wait for the MLflow tracking server
      ansible.builtin.uri:
        url: http://127.0.0.1:5000/health
        method: GET
        status_code: 200
      register: mlflow_health
      until: mlflow_health.status == 200
      retries: 60
      delay: 5
      tags: [stack, training]

    - name: Run formatting, lint, and security checks
      ansible.builtin.command: make check
      args:
        chdir: "{{ project_dir }}"
      tags: [quality]

    - name: Run project tests
      ansible.builtin.command: make test
      args:
        chdir: "{{ project_dir }}"
      tags: [tests]

    - name: Train project models
      ansible.builtin.command: make "{{ item }}"
      args:
        chdir: "{{ project_dir }}"
      environment:
        MLFLOW_TRACKING_URI: http://127.0.0.1:5000
      loop:
        - train_model
        - train_hex_model
        - train_iris_model
      tags: [training]
