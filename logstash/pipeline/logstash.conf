input {
  beats {
    port => 5044
    type => "beats"
  }

  file {
    path => "/app/logs/mlflow.log"
    start_position => "beginning"
    type => "mlflow_logs"
    codec => "plain"
  }

  file {
    path => [
      "/app/logs/mlops.log",
      "/app/logs/malwer_detecter.log",
      "/app/logs/cluster_monitoring.log",
      "/app/host-logs/hex_malware_detection.log",
      "/app/host-logs/malwer_detecter.log",
      "/app/host-logs/cluster_monitoring.log"
    ]
    start_position => "beginning"
    type => "mlops_logs"
    codec => "plain"
  }

  heartbeat {
    interval => 30
    type => "heartbeat"
  }
}

filter {
  if [type] == "mlops_logs" {
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:log_timestamp} %{LOGLEVEL:log_level} %{DATA:logger_name} %{GREEDYDATA:log_message}"
      }
    }

    if [log_message] =~ /^event=/ {
      kv {
        source => "log_message"
        target => "event_data"
        field_split => " "
        value_split => "="
      }

      mutate {
        add_field => {
          "event_category" => "%{[event_data][event]}"
        }
        convert => {
          "[event_data][metric_accuracy]" => "float"
          "[event_data][metric_precision]" => "float"
          "[event_data][metric_recall]" => "float"
          "[event_data][metric_f1]" => "float"
          "[event_data][accuracy]" => "float"
          "[event_data][test_rows]" => "integer"
          "[event_data][dataset_rows]" => "integer"
          "[event_data][dataset_columns]" => "integer"
          "[event_data][feature_count]" => "integer"
          "[event_data][train_rows]" => "integer"
          "[event_data][true_negative]" => "integer"
          "[event_data][false_positive]" => "integer"
          "[event_data][false_negative]" => "integer"
          "[event_data][true_positive]" => "integer"
          "[event_data][sample_id]" => "integer"
          "[event_data][feature_usage_counter]" => "float"
          "[event_data][feature_fs_excl_counter]" => "float"
          "[event_data][feature_task_size]" => "float"
          "[event_data][feature_end_data]" => "float"
          "[event_data][feature_policy]" => "float"
          "[event_data][feature_nivcsw]" => "float"
          "[event_data][feature_importance]" => "float"
          "[event_data][importance_rank]" => "integer"
        }
      }

      date {
        match => [ "log_timestamp", "yyyy-MM-dd HH:mm:ss", "ISO8601" ]
        target => "@timestamp"
      }
    }
  }

  if [type] == "mlflow_logs" {
    if [message] =~ /MLFLOW_EVENT:/ {
      grok {
        match => { "message" => "MLFLOW_EVENT: %{GREEDYDATA:event_json}" }
      }

      json {
        source => "event_json"
        target => "mlflow_event"
      }

      mutate {
        add_field => {
          "pipeline" => "mlflow"
          "log_level" => "INFO"
          "logger_name" => "mlflow_app"
        }
      }

      if [mlflow_event][event_type] {
        mutate {
          add_field => { "event_category" => "%{[mlflow_event][event_type]}" }
        }
      }

      if [mlflow_event][timestamp] {
        date {
          match => [ "mlflow_event.timestamp", "ISO8601" ]
          target => "@timestamp"
        }
      }
    }
    else {
      grok {
        match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{DATA:name} %{GREEDYDATA:log_message}" }
      }

      mutate {
        add_field => {
          "pipeline" => "mlflow"
          "event_category" => "general_log"
        }
      }
    }
  }

  if [type] == "beats" {
    mutate {
      add_field => { "pipeline" => "general" }
    }

    if [message] =~ /^\{.*\}$/ {
      json {
        source => "message"
        target => "parsed_log"
      }
    }
  }

  if [type] == "heartbeat" {
    mutate {
      add_field => {
        "pipeline" => "monitoring"
        "event_category" => "heartbeat"
      }
    }
  }

  mutate {
    add_field => {
      "environment" => "mlops"
      "service" => "mlflow_pipeline"
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "logs-%{+YYYY.MM.dd}"
    user => "elastic"
    password => "${LOGSTASH_INTERNAL_PASSWORD}"
    template_name => "logs"
    template => "/usr/share/logstash/pipeline/logs-template.json"
  }

  stdout {
    codec => rubydebug
  }
}